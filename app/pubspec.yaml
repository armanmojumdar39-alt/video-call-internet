name: connecto
description: Connecto - phone-number based video calling, no username or password.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  socket_io_client: ^2.0.3+1
  flutter_webrtc: ^0.11.7
  flutter_contacts: ^1.1.9+2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
